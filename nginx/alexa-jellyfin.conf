# HTTP -> HTTPS redirection
server {
    listen 80;
    server_name alexa.votredomaine.fr;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server for Jellyfin Alexa Skill
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alexa.votredomaine.fr;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    # (Optionnel mais recommandé) Filtrage par IP Amazon Alexa
    # include /etc/nginx/conf.d/amazon-alexa-ips.include;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_alexa jellyfin-alexa-skill:4430;
        proxy_pass http://$upstream_alexa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # En-têtes obligatoires pour la validation de signature cryptographique Alexa :
        proxy_set_header SignatureCertChainUrl $http_signaturecertchainurl;
        proxy_set_header Signature $http_signature;
        proxy_pass_request_headers on;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }
}
